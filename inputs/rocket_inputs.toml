[global]
non_propulsion_mass_kg      = 8.0    # Everything but the propulsion system, payload included
target_altitude_m           = 3000.0
target_thrust_N             = 3000.0
target_chamber_pressure_bar = 30.0
inner_rocket_diameter_m     = 0.12   # Airframe bore, the engine has to fit inside it
outer_rocket_diameter_m     = 0.125  # Airframe skin, sets the drag area. The tanks are structural and use it

[aerodynamics]
# Vehicle drag coefficient against Mach number. Linearly interpolated, and
# held constant outside the table. Placeholder curve, not yet validated
drag_mach = [0.8,  1.2,  2.0]
drag_cd   = [0.48, 0.85, 0.65]

[oxidizer_tank]
pressure_bar            = 70.0
safety_factor           = 3.0
ullage_fraction         = 0.1
boss_opening_m          = 0.02
boss_length_fwd_m       = 0.015
boss_length_aft_m       = 0.019

[pressurizer_tank]
pressure_bar            = 200.0
safety_factor           = 3.0
boss_opening_m          = 0.02
boss_length_fwd_m       = 0.015
boss_length_aft_m       = 0.015
reg_margin_bar          = 20.0
ambient_temp_c          = 30.0

[injector]
cd                      = 0.25

[fuel]
port_diam_m             = 0.05
reg_exponent            = 0.5
reg_ref_ms              = 0.0001
oxy_mass_flux_ref_kgm2s = 1.0

[igniter]
burn_time_s             = 1.0
burn_rate_ms            = 0.0015
flame_spread_ms         = 0.15
max_spread_delay_s      = 0.10
thermite_density_kgm3   = 3800.0

[nozzle]
nozzle_exit_diameter_m        = 0.09   # Fixed, the expansion ratio A_exit / A_throat follows from it
conical_nozzle_half_angle_deg = 15.0   # Sets the length, L = (r_exit - r_throat) / tan(angle)

[models]
atmosphere              = "auto" # "auto" | "isacalc" | "standalone"
chemistry               = "auto" # "auto" | "cea" | "rocketcea"
pressurant_thermo       = "auto" # "auto" | "coolprop" | "ideal"
pressurant_psat         = false  # Use CoolProp N2O Psat when CoolProp is active

[efficiencies]
combustion              = 0.88
trajectory              = 0.92
propellant_utilization  = 0.92
regression_correction   = 0.60
nozzle_friction         = 0.95

# Starting point for the optimizer
[optimization]
propellant_mass_kg      = 5.0
mixture_ratio           = 7.0
injector_area_m2        = 0.0001
nozzle_throat_area_m2   = 0.0007
