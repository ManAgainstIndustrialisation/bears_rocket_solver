# Physical constants
#
# Every physical constant used by the solver is defined here and nowhere else
# in the code. All values are in SI units

[universal]
standard_gravity   = 9.80665           # g0 [m/s^2], exact by definition
molar_gas_constant = 8.31446261815324  # R = N_A * k [J/(mol*K)], exact since the 2019 SI
zero_celsius       = 273.15            # 0 degC [K], exact by definition

[reference]
# Standard reference state for thermochemistry, e.g. enthalpies of formation
temperature = 298.15  # [K]

[atmosphere]
# International Standard Atmosphere (ISO 2533), sea level and troposphere
sea_level_pressure     = 101325.0  # [Pa]
sea_level_temperature  = 288.15    # [K]
lapse_rate             = 0.0065    # Tropospheric temperature lapse rate [K/m]
tropopause_temperature = 216.65    # [K]

[air]
# Dry air, treated as a calorically perfect ideal gas
molar_mass = 0.0289644  # [kg/mol]
gamma      = 1.4        # Ratio of specific heats cp / cv
